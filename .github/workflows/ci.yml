name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: flask db upgrade
        env:
          DATABASE_URL: sqlite:////tmp/ci.db
      - run: flask db check
        env:
          DATABASE_URL: sqlite:////tmp/ci.db
      - run: pytest

  frontend:
    name: Frontend check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          include-hidden-files: true
          retention-days: 7

  apache:
    name: Apache, .htaccess and headers
    runs-on: ubuntu-24.04
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - run: test -f dist/.htaccess
      - run: sudo apt-get update -q && sudo apt-get install -y -q apache2 libapache2-mod-wsgi-py3 libapache2-mod-php
      - run: bash deploy/apache-test-setup.sh .
      - run: bash deploy/check-apache.sh http://localhost 0123456789abcdef0123456789abcdef.webp
      - if: failure()
        run: sudo tail -n 60 /var/log/apache2/mums-jams-error.log
