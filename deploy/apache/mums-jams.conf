Define APP_ROOT /srv/mums-jams
Define APP_HOST mums-jams.westeurope.cloudapp.azure.com

<VirtualHost *:80>
    ServerName ${APP_HOST}
    DocumentRoot ${APP_ROOT}/dist

    LimitRequestBody 12648448

    <Directory />
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    <Directory ${APP_ROOT}/dist>
        Options SymLinksIfOwnerMatch
        AllowOverride All
        Require all granted
    </Directory>

    Alias /uploads/ ${APP_ROOT}/backend/uploads/
    <Directory ${APP_ROOT}/backend/uploads>
        Options None
        AllowOverride All
        Require all granted
    </Directory>

    WSGIDaemonProcess mums-jams processes=1 threads=8 display-name=%{GROUP} python-home=${APP_ROOT}/backend/.venv python-path=${APP_ROOT}/backend
    WSGIProcessGroup mums-jams
    WSGIApplicationGroup %{GLOBAL}
    WSGICallableObject app
    WSGIScriptAliasMatch ^/(api/.*|robots\.txt|sitemap\.xml)$ ${APP_ROOT}/backend/wsgi.py/$1
    <Directory ${APP_ROOT}/backend>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/mums-jams-error.log
    CustomLog ${APACHE_LOG_DIR}/mums-jams-access.log combined
</VirtualHost>
